services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: directory
      POSTGRES_PASSWORD: directory
      POSTGRES_DB: directory_dev
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directory"]
      interval: 2s
      retries: 15
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
volumes:
  pgdata:
