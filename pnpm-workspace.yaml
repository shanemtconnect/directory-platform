# esbuild's postinstall only fetches and verifies its own native binary, and
# nothing here executes esbuild: Next builds with Turbopack, and vitest and
# drizzle-kit carry it as a transitive dependency they do not need built.
#
# This has to be an explicit verdict rather than a placeholder — pnpm 12 fails
# the whole install with ERR_PNPM_IGNORED_BUILDS on any dependency it has no
# answer for, which broke a clean `pnpm install --frozen-lockfile` in CI and in
# the Docker build alike.
allowBuilds:
  # @sentry/cli's postinstall downloads a ~16 MB native binary whose only job is
  # uploading source maps, which happens inside `withSentryConfig()` — and this
  # repo deliberately does not use it (see lib/observability/sentry.ts). Nothing
  # in the app, the worker or the Docker build ever executes the binary, so
  # fetching it would add 16 MB to every install and every image layer to sit
  # unused. Stack traces stay minified in Sentry as a result; that is the trade,
  # and it is reversible by adding the wizard's build plugin later.
  '@sentry/cli': false
  esbuild: false
